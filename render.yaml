services:
  - type: web
    name: personal-ai-assistant-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: personal-ai-assistant-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: personal-ai-assistant-db
    databaseName: personal_ai_assistant
    user: personal_ai_assistant
